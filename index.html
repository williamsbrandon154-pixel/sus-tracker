  },
  setImps(v) { state.imps = Number(v); state.impOverride = null; commit(); },
  setMap(v) { if (state.map === v) return; state.map = v; state.fakes = {}; state.routeFrom = null; lastFake = null; watchSel = null; commit(); toast(`Map: ${MAPS[v].name}`); },
  toggleColor(id) {
    const i = state.lobby.indexOf(id);
    if (i >= 0) {
      if (state.lobby.length <= 4) { toast('A game needs at least 4 players'); return; }
      state.lobby.splice(i, 1);
      if (state.me === id) state.me = state.lobby[0];
    } else {
      if (state.lobby.length >= 15) { toast('Lobbies max out at 15 players'); return; }
      state.lobby.push(id);
    }
    commit();
  },
  setMe(id) { state.me = id; commit(); },
  newGame() {
    if (!arm('newGame')) return;
    state = newGame(state); state.tab = 'players';
    commit(); toast('New game started');
  },
  resetAll() {
    if (!arm('resetAll')) return;
    state = newGame(); commit(); toast('Everything cleared');
  },
  freshFromExample() { state = newGame({mode: state.mode, map: state.map, imps: state.imps, settings: state.settings}); commit(); toast('Fresh game. Set your lobby in Setup.'); state.tab = 'setup'; commit(); },
  addFake(n) {
    const t = taskByName(n); if (!t) return;
    const f = {done: t.st.map(() => false), room: t.st.map(() => null), readyAt: null, skip: 0};
    /* steps whose room comes from the in-game list: ask for those first */
    const queue = t.st.map((x, i) => (x.pick || (x.wire && i === 0)) ? i : -1).filter(i => i >= 0);
    if (queue.length) { picking = {n, f, queue}; renderPicker(); return; }
    state.fakes[n] = f;
    commit(); toast(`${n} added to your route`);
  },
  pickRoom(v) {
    if (!picking) return;
    const t = taskByName(picking.n), i = picking.queue.shift();
    picking.f.room[i] = t.st[i].wire ? Number(v) : v;
    if (picking.queue.length) { renderPicker(); return; }
    state.fakes[picking.n] = picking.f;
    const n = picking.n;
    picking = null; $('#sheet').hidden = true; $('#sheet').innerHTML = '';
    commit(); toast(`${n} added to your route`);
  },
  removeFake(n) { delete state.fakes[n]; if (lastFake && lastFake.n === n) lastFake = null; commit(); },
  routeFake(v) {
    const {t, i, key} = splitStep(v); if (!t) return;
    const st = t.st[i];
    startTimer({title: t.n, sub: stageLabel(t, i, key), secs: fakeSeconds(st),
      note: st.s == null ? 'This one varies, so any believable time works. 8 seconds is a safe middle.' : 'Stand still at the panel. Walk away when it hits zero.',
      onDone() { completeStep(t, i, key); }});
  },
  routeDone(v) { const {t, i, key} = splitStep(v); if (t) completeStep(t, i, key); },
  routeLater(v) {
    const names = v.split('|').filter(n => state.fakes[n]);
    names.forEach(n => { state.fakes[n].skip = (state.fakes[n].skip || 0) + 1; });
    commit(); toast('Moved that stop later in your route');
  },
  routeUndo() {
    if (!lastFake) return;
    const f = state.fakes[lastFake.n];
    if (f) { f.done[lastFake.i] = false; f.room[lastFake.i] = lastFake.prevRoom; f.readyAt = lastFake.prevReady; }
    state.routeFrom = lastFake.prevFrom;
    state.log = state.log.filter(e => e.id !== lastFake.logId);
    lastFake = null;
    commit();
  },
  timerStop() { stopTimer(false); },
  watchToggle() { watchToggle(); },
  setAwake(v) { setAwake(v === '1'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el) {
    const fn = actions[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el.dataset.v, el); }
    return;
  }
  if (e.target === $('#sheet')) actions.closeSheet();
});

document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  if (form.dataset.form === 'voice') { submitVoice(); return; }
  const input = form.querySelector('input');
  const text = input.value.trim();
  if (!text) return;
  const kind = form.dataset.form;
  if (kind === 'playerNote') { addLog('note', {who: sheetFor, text}); commit(); toast('Note added'); return; }
  if (kind === 'note') { addLog('note', {text}); commit(); $('#note-input').focus(); return; }
  if (kind === 'story') { addLog('mine', {text}); commit(); $('#story-input').focus(); return; }
  if (kind === 'claim') {
    if (!claimWho) { toast('Pick who is talking first'); return; }
    addLog('claim', {who: claimWho, text}); commit(); $('#claim-input').focus(); return;
  }
});

document.addEventListener('compositionstart', e => { if (e.target.id === 'vlog') composing = true; });
document.addEventListener('compositionend', e => { if (e.target.id === 'vlog') { composing = false; onVoiceInput(); } });
document.addEventListener('input', e => {
  if (e.target.id === 'vlog') onVoiceInput();
  if (e.target.id === 'task-q') filterTasks(e.target.value);
  if (e.target.dataset && e.target.dataset.name) {
    const v = e.target.value.trim();
    if (v) state.names[e.target.dataset.name] = v; else delete state.names[e.target.dataset.name];
    save(); renderChrome();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'watch-task') { watchSel = e.target.value; watch.verdict = null; render(); }
  if (e.target.id === 'route-from') { state.routeFrom = e.target.value; commit(); }
  if (e.target.dataset && e.target.dataset.name) render();
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#timer').hidden) stopTimer(false);
  else if (sheetFor || picking || helpOpen) actions.closeSheet();
});

/* =====================================================================
   6. TIMERS. The fake-task countdown and the crew stopwatch both use
   Date.now(), so they stay accurate even when the phone throttles.
   ===================================================================== */
let timer = null;
function startTimer({title, sub, secs, note, onDone}) {
  stopTimer(false);
  const box = $('#timer');
  box.classList.remove('done');
  $('#timer-title').textContent = title;
  $('#timer-sub').textContent = sub;
  $('#timer-note').textContent = note;
  $('#timer-kicker').textContent = 'Hold at the panel';
  box.hidden = false;
  const C = 326.73, total = secs * 1000, t0 = Date.now();
  const draw = () => {
    const left = Math.max(0, total - (Date.now() - t0));
    $('#timer-num').textContent = (Math.ceil(left / 100) / 10).toFixed(1);
    $('#timer-prog').setAttribute('stroke-dashoffset', String(C * (1 - left / total)));
    if (left <= 0) {
      clearInterval(timer.h);
      box.classList.add('done');
      $('#timer-kicker').textContent = 'Done';
      $('#timer-note').textContent = 'Walk away like you finished it.';
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
      onDone && onDone();
      timer.close = setTimeout(() => stopTimer(true), 1400);
    }
  };
  timer = {h: setInterval(draw, 100)};
  draw();
  box.querySelector('button').focus();
}
function stopTimer() {
  if (!timer) { $('#timer').hidden = true; return; }
  clearInterval(timer.h); clearTimeout(timer.close);
  timer = null;
  $('#timer').hidden = true;
}

let watchSel = null;
const watch = {running: false, t0: 0, elapsed: 0, h: null, verdict: null};
function watchToggle() {
  if (!watch.running) {
    watch.running = true; watch.t0 = Date.now(); watch.elapsed = 0; watch.verdict = null;
    watch.h = setInterval(() => { watch.elapsed = (Date.now() - watch.t0) / 1000; const n = $('#watch-num'); if (n) n.textContent = watch.elapsed.toFixed(1); }, 100);
    render();
    return;
  }
  clearInterval(watch.h); watch.running = false;
  watch.elapsed = (Date.now() - watch.t0) / 1000;
  const sel = $('#watch-task') ? $('#watch-task').value : watchSel;
  watchSel = sel;
  watch.verdict = judge(watch.elapsed, sel);
  render();
}
function judge(elapsed, sel) {
  if (!sel) return {lvl: 'warn', text: 'Pick the task they were doing.'};
  const [n, i] = sel.split('|');
  const t = taskByName(n); if (!t) return null;
  const x = t.st[Number(i)];
  const [lo, hi] = Array.isArray(x.s) ? x.s : [x.s, x.s];
  const took = `${elapsed.toFixed(1)}s`, real = fmtSecs(x.s);
  if (elapsed < lo * 0.6) return {lvl: 'bad', text: `${took} is way too fast. A real ${n} takes ${real}. Sus.`};
  if (elapsed < lo - 0.6) return {lvl: 'warn', text: `${took} is a little fast for ${n} (${real}). Keep an eye on them.`};
  if (elapsed <= hi + 4) return {lvl: 'ok', text: `${took} checks out for ${n} (${real}).`};
  return {lvl: 'warn', text: `${took} is long for ${n} (${real}). Could be faking, could be a slow player.`};
}

/* keep the phone screen on during a game, where the browser allows it */
let wakeLock = null;
async function setAwake(on) {
  try {
    if (on) {
      if (!('wakeLock' in navigator)) throw new Error('unsupported');
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
      state.awake = true; toast('Screen will stay on while this page is open');
    } else {
      if (wakeLock) await wakeLock.release();
      wakeLock = null; state.awake = false;
    }
  } catch (e) {
    state.awake = false; toast("This browser won't keep the screen on here");
  }
  commit();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state && state.awake && !wakeLock) setAwake(true);
});

/* refresh "seen 3m ago" text once a minute while nothing is being typed */
/* the voice box sits outside the re-rendered area, so typing there doesn't count as busy */
const isBusy = () => (document.activeElement && document.activeElement.id !== 'vlog'
    && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))
  || sheetFor || picking || helpOpen || !$('#timer').hidden || watch.running;
setInterval(() => { if (!isBusy()) render(); }, 60000);

/* count down "come back in 0:42" once a second; re-plan when one runs out */
setInterval(() => {
  let ranOut = false;
  document.querySelectorAll('[data-ready]').forEach(el => {
    const left = Number(el.dataset.ready) - Date.now();
    el.textContent = fmtLeft(left);
    if (left <= 0 && !el.dataset.fired) { el.dataset.fired = '1'; ranOut = true; }
  });
  if (ranOut && !isBusy()) render();
}, 1000);

/* =====================================================================
   7. BOOT. Restore a saved game, or open the example game.
   ===================================================================== */
function start(data) {
  state = (data && data.state) || load() || exampleGame();
  if (!MAPS[state.map]) state.map = 'skeld';
  state.awake = false;
  /* games saved by an older version: give each fake task the newer fields */
  for (const [n, f] of Object.entries(state.fakes || {})) {
    const t = (MAPS[state.map].tasks || []).find(x => x.n === n);
    if (!t) { delete state.fakes[n]; continue; }
    f.done = t.st.map((_, i) => !!(f.done && f.done[i]));
    f.room = t.st.map((_, i) => (f.room && f.room[i] != null) ? f.room[i] : null);
  }
  render();
  initHandsFree();
}
window.claude?.hot?.snapshot?.(() => ({state}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
